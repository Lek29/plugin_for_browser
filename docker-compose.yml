version: '3.8'

services:
  web:
    build: .
    ports:
      - "${APP_PORT}:8080"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis_db
  redis_db:
    image: "redis:alpine"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=my_super_secret_pass
    ports:
      - '${REDIS_PORT}:6379'
